# Hooks with the same priority will be run concurrently by `prek`.
#
# Priority 0 is read-only hooks, and hooks that modify disjoint file types.
# Priorities 0-2 includes some lint-autofix hooks, so various read-only lint
# hooks are included in priority >=2 to ensure they don't report lint
# violations that have already been fixed by earlier hooks.

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
        priority: 0
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        language: python # means renovate will update the `additional_dependencies` for the hook
        additional_dependencies: ["tomli==2.4.1"]
        priority: 0
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 17e12779811926f000bdfa1795f9e3735dd71ac3 # frozen: 0.26
    hooks:
      - id: validate-pyproject
        priority: 0
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8 # frozen: 0.38.0
    hooks:
      - id: check-github-workflows
        priority: 0
  # `actionlint` hook, for verifying correct syntax in GitHub Actions workflows.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        additional_dependencies:
          # actionlint has a shellcheck integration which extracts shell scripts in `run:` steps from GitHub Actions
          # and checks these with shellcheck. This is arguably its most useful feature,
          # but the integration only works if shellcheck is installed.
          #
          # NOTE: if this is pinned to an exact hash, renovate won't update it as of 2026-07-06;
          # it will only update the version if the tag is understood as a valid Go version.
          # Pinning to an exact hash is also less important for a go dependency anyway;
          # Go has better protections against mutable tags than the Python ecosystem, for example:
          # https://go.dev/blog/supply-chain
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1"
        language: golang # means renovate will also update `additional_dependencies`
        priority: 0
  # zizmor detects security vulnerabilities in GitHub Actions workflows.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa # frozen: v1.29.0
    hooks:
      - id: zizmor
        priority: 0
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-merge-conflict
        priority: 0
      - id: check-case-conflict
        priority: 0
      - id: end-of-file-fixer
        priority: 0
      - id: name-tests-test
        args: [--pytest-test-first]
        priority: 0
      - id: trailing-whitespace
        priority: 1
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0 # frozen: v0.49.1
    hooks:
      - id: markdownlint
        priority: 0
      - id: markdownlint-fix
        priority: 2
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb # frozen: v0.16.8
    hooks:
      - id: ruff-check
        priority: 2
      - id: ruff-format
        priority: 3
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: ac772f901bb576d192f2f219574a9f02194d51ed # frozen: v0.0.83
    hooks:
      - id: ty
        args: [--fix]
        priority: 0
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 17a6b18b8006d390e476d419631aae885cadfa40 # frozen: 0.12.17
    hooks:
      - id: uv-lock
        priority: 0
        args: [--default-index=https://pypi.org/simple, --refresh, --check]
